name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # No gradlew checked in (scaffolded on a machine without a local JDK) —
      # setup-gradle provisions a matching Gradle directly, so plain `gradle`
      # works here without one.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catch-debug-apk
          path: ${{ steps.apk.outputs.path }}

      # Moves a floating tag/release so there's always one stable, easy link
      # to open on a phone and download from — no re-zipping, no login wall.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f latest-build
          git push -f origin latest-build
          gh release delete latest-build --yes || true
          gh release create latest-build "${{ steps.apk.outputs.path }}" \
            --title "Catch (latest build)" \
            --notes "Auto-built from commit ${{ github.sha }}" \
            --prerelease
